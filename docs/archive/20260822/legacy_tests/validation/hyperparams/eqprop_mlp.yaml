# EqProp MLP hyperparameters — derived from tests/unit/validation/hyperparams/sweep_results.json
# (tuned on the synthetic 64-dim / 10-class parity task).
model: eqprop_mlp
family: eqprop
# Tuned training hyperparameters
hidden_dim: 64
num_layers: 2
lr: 0.001
beta: 0.03
max_steps: 20
gradient_method: contrastive
use_spectral_norm: true
hebbian_lr: 0.008
# Common gate knobs
batch_size: 32
# GATE-0: pre-existing EqProp gradient drift (verified 2026-08-14) — eqprop_mlp
# acc 0.198 vs backprop 0.366. Threshold >0.05 marks the documented gap so the
# registry audit reports `documented-gap`, matching directed_ep. Locked until
# LOOP/RULE parity work lands.
parity_threshold: 0.2
