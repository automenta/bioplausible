[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computronium-stability"
version = "0.1.0"
description = "Calibrated stability guard for dynamical neural systems — extracted from Computronium"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["computronium_stability*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["computronium_stability"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PT", "PIE"]
ignore = ["E501", "B023"]

[tool.pyright]
strict = true
venvPath = ".venv"
venv = ".venv"