[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["docs.archive*"]
include = ["bioplausible", "bioplausible.*"]

[tool.setuptools]
include-package-data = true

[project]
name = "bioplausible"
version = "1.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchvision",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "tqdm",
    "rich",
    "gymnasium",
    "scikit-learn",
    "transformers",
    "datasets",
    "tokenizers",
    "onnx",
    "onnxscript",
    "psutil",
    "PyQt6",
    "pyqtgraph",
    "kademlia",
    "uvicorn",
    "fastapi",
    "pydantic>=2.0",
    "optuna",
    "omegaconf>=2.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-qt",
    "pytest-mock",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
]
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
spiking = ["snnTorch>=0.8"]
llm = ["openai>=1.0"]
full = ["bioplausible[knowledgebase,graphs,spiking]"]

[project.urls]
homepage = "https://github.com/bioplausible/bioplausible"
repository = "https://github.com/bioplausible/bioplausible"
documentation = "https://bioplausible.readthedocs.io"

[project.scripts]
eqprop-verify = "bioplausible.cli:main"
eqprop-p2p-worker = "bioplausible.p2p.p2p_worker:main"
biopl-scientist = "bioplausible.execution.cli:main_scientist"
biopl-report = "bioplausible.execution.cli:main_reporter"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (e.g. MNIST full epoch)"]
addopts = "--cov=bioplausible --cov-report=term-missing --cov-fail-under=40 -p no:warnings"

[tool.coverage.run]
source = ["bioplausible"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "TID",  # flake8-tidy-imports
    "PYI",  # flake8-pyi
    "bad-quotes-inline-string", # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = ["whitespace-before-punctuation", "line-too-long", "lowercase-imported-as-non-lowercase", "ambiguous-unicode-character-comment"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "hardcoded-password-func-arg", "too-many-arguments", "too-many-statements", "raise-vanilla-args"]
"tests/**/conftest.py" = ["too-many-arguments", "too-many-statements"]
"examples/legacy/**/*.py" = ["assert", "hardcoded-password-func-arg", "too-many-arguments", "too-many-statements"]
"examples/**/*.py" = ["assert", "hardcoded-password-func-arg", "too-many-arguments", "too-many-statements"]
"scripts/legacy/**/*.py" = ["assert", "hardcoded-password-func-arg", "too-many-arguments", "too-many-statements", "raise-vanilla-args"]
"scripts/**/*.py" = ["assert", "hardcoded-password-func-arg", "too-many-arguments", "too-many-statements", "raise-vanilla-args"]
"docs/**/*.py" = ["assert", "hardcoded-password-func-arg", "too-many-arguments", "too-many-statements", "raise-vanilla-args"]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 88

[tool.pyright]
# Relaxed from `strict = true` to a per-rule config: noisy inference-by-flow
# rules (reportUnknown*, reportMissingType*, reportMissingParameterType)
# are downgraded to warnings to reduce churn on a fast-moving research
# codebase.  Hard correctness rules (reportMissingImports,
# reportMissingModuleSource, reportInvalidTypeForm, reportInvalidTypeVarUse)
# stay as errors.
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportInvalidTypeForm = "error"
reportInvalidTypeVarUse = "error"
reportInvalidTypeComments = "error"
reportUnusedTypeIgnore = "warning"
reportUnusedCast = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedIgnore = "warning"
reportUnusedParameter = "warning"
reportPrivateImportUsage = "warning"
reportDeprecated = "warning"
reportConstantRedefinition = "warning"
reportInconsistentConstructor = "warning"
reportInconsistentOverload = "warning"
reportInvalidStubStatement = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportWildcardImportFromLibrary = "warning"
reportImplicitRelativeImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUnusedCoroutine = "warning"
reportUnusedImport = "warning"
reportUnusedExcept = "warning"
reportUnusedExpression = "warning"
pythonVersion = "3.14"
targetVersion = "3.14"

[tool.hypothesis]
# Property-based testing configuration
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
