[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
computronium_stability = "computronium/stability"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["computronium*", "computronium_stability*"]

[project]
name = "computronium"
version = "1.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML framework
    "torch>=2.5",
    # Numerical
    "numpy",
    # CLI / progress / output
    "tqdm",
    "rich",
    # Configuration & validation
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "kademlia>=2.2.3",
    "torch-geometric>=2.8.0.post1",
]

[project.optional-dependencies]
# --- Development tools ---
dev = [
    # Test framework
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-mock",
    "hypothesis>=6.0",
    # Code quality
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
    # Test dependencies
    "torchvision",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "optuna",
    "tabulate>=0.9",
    "psutil",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "datasets",
    "nicegui>=3.16.0",
    "plotly>=6.9.0",
    "cryptography==50.0.0",
]

# --- Core feature groups ---
nn = []  # ComputroniumLinear, pluggable credit rules — zero extra deps
stability = []  # Stability guard, spectral radius — zero extra deps

# --- Domain / data ---
vision = ["torchvision"]
lm = ["transformers", "datasets", "tokenizers"]
rl = ["gymnasium"]
spiking = ["snnTorch>=0.8", "cupy-cuda13x>=14.1.1"]

# --- Training infrastructure ---
lightning = ["pytorch-lightning>=2.0.0"]
analysis = ["optuna", "tabulate>=0.9"]

# --- ML/data utilities ---
ml = ["scikit-learn", "pandas", "scipy"]

# --- Plotting & visualization ---
plot = ["matplotlib", "seaborn", "plotly>=6.9.0"]

# --- Deployment & serving ---
deploy = ["fastapi", "uvicorn"]
export = ["onnx", "onnxscript", "onnxruntime"]

# --- Networking ---
p2p = ["kademlia", "grpcio>=1.62", "grpcio-tools>=1.62"]

# --- Desktop UI ---
ui = ["PyQt6", "pyqtgraph", "nicegui>=3.16.0"]

# --- System monitoring ---
monitoring = ["psutil"]

# --- Existing optional groups ---
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
llm = ["openai>=1.0"]

# --- Full install ---
full = [
    "computronium[vision,lm,rl,spiking,lightning,analysis,ml,plot,deploy,export,p2p,ui,monitoring,knowledgebase,graphs,llm,nn,stability]",
]

[project.urls]
homepage = "https://github.com/computronium/computronium"
repository = "https://github.com/computronium/computronium"
documentation = "https://computronium.readthedocs.io"

[project.scripts]
comp = "computronium.cli.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "hypothesis>=6.161.2",
    "libcst>=1.9.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property"]
markers = [
    "slow: marks tests as slow (e.g. MNIST full epoch)",
    "gpu: runs on CUDA device; skipped when GPU unavailable",
    "gpu_only: requires CUDA; skipped on CPU-only machines",
    "cpu_only: runs on CPU only; skipped when GPU required",
    "benchmark: performance/parity benchmark producing JSONL",
    "flaky: quarantined non-deterministic test (Sprint 5.6)",
    "llm: requires a real LLM provider; skipped in CI",
    "integration: integration tests requiring external deps or long runtime",
    "filterwarnings: builtin, registered for --strict-markers compat",
    "timeout: marks tests with a timeout (requires pytest-timeout)",
]
addopts = "--strict-markers --durations=25 -m 'not slow and not benchmark and not llm' -p no:warnings"
faulthandler_timeout = 120
timeout = 60
timeout_method = "signal"

[tool.coverage.run]
source = ["computronium"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/acceleration/*",
    "*/analysis/*",
    "*/validation/*",
    "*/cli/*",
    "*/experiments/*",
    "*/joint/*",
    "*/plasticity/*",
    "*/tile/*",
    "*/autoscientist/*",
    "*/models/native/*",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
exclude = ["*.md", "*_pb2.py", "*_pb2_grpc.py", "docs/archive", "demo"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = [
    "line-too-long",  # disabled forever (user directive 2026-09-03): formatter handles what it can, the rest is noise
    "magic-value-comparison", # numeric research thresholds (0.5, 1e-4, ...) are the domain's first-class objects
    "no-self-use", # protocol implementations keep a uniform method surface (self unused by design)
    "invalid-argument-name",    # math notation (W, G, V, X) is the domain's naming convention
    "non-lowercase-variable-in-function",    # ditto for local math variables
    "raise-vanilla-args",  # long messages in raise calls are the sanctioned error style (AGENTS.md)
    "unused-function-argument",  # the family-neutral pipeline passes uniform args; primitives ignore some by design
    "unused-method-argument",
    "ambiguous-unicode-character-docstring",  # Greek/math symbols (β, θ, ≈) in docstrings are the domain language
    "ambiguous-unicode-character-comment",
    "ambiguous-unicode-character-string",
    "float-equality-comparison",  # exact float equality is load-bearing (bitwise L5 locks), not a bug
]

[tool.ruff.lint.per-file-ignores]
"computronium/__init__.py" = [
    "undefined-export", # __all__ names resolve through the _LAZY import map
]
"computronium/ontology/dynamics/__init__.py" = [
    "non-empty-init-module", # DYNAMICS_REGISTRY lives beside its classes (R1.1)
]
"computronium/ontology/dynamics/_dynamics.py" = [
    "non-augmented-assignment", # out-of-place adds are the settle graph-safety idiom (R5.3)
]
"computronium/ontology/_settle_kernel.py" = [
    "non-augmented-assignment", # out-of-place adds are the settle graph-safety idiom (R5.3)
]
"tests/**/*.py" = [
    "assert",   # assert in tests
    "no-self-use", # no-self-use in test methods
    "suspicious-subprocess-import",   # subprocess CLI smoke tests
    "subprocess-without-shell-equals-true",   # subprocess.run with fixed args
    "start-process-with-partial-path",   # partial-path executables (uv)
    "suspicious-non-cryptographic-random-usage",   # random.Random in test samplers/fixtures
    "magic-value-comparison", # literal expected values in assertions
]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 9
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
max-positional-args = 9

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.hypothesis]
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
