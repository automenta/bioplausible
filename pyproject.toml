[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["docs.archive*"]
include = ["bioplausible", "bioplausible.*"]

[tool.setuptools]
include-package-data = true

[project]
name = "bioplausible"
version = "1.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML framework
    "torch>=2.0.0",

    # Numerical
    "numpy",

    # CLI / progress / output
    "tqdm",
    "rich",

    # Configuration & validation
    "pydantic>=2.0",
    "omegaconf>=2.3",

    # Spiking neural networks (LIF kinetics for SpikingSTDP)
    "snnTorch>=0.8",
]

[project.optional-dependencies]
# --- Development tools ---
dev = [
    # Test framework
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-mock",
    "hypothesis>=6.0",
    # Code quality
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
    # All packages needed by test suite (domain imports cascade widely)
    "pytorch-lightning>=2.0.0",
    "torchvision",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "optuna",
    "tabulate>=0.9",
    "psutil",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "kademlia",
    "onnxruntime",
    "datasets",
]

# --- Domain / data ---
vision = ["torchvision"]
lm = ["transformers", "datasets", "tokenizers"]
rl = ["gymnasium"]

# --- Training infrastructure ---
lightning = ["pytorch-lightning>=2.0.0"]
analysis = ["optuna", "tabulate>=0.9"]

# --- ML/data utilities ---
ml = ["scikit-learn", "pandas", "scipy"]

# --- Plotting & visualization ---
plot = ["matplotlib", "seaborn"]

# --- Deployment & serving ---
deploy = ["fastapi", "uvicorn", "onnxruntime"]
export = ["onnx", "onnxscript"]

# --- Networking ---
p2p = ["kademlia"]

# --- Desktop UI ---
ui = ["PyQt6", "pyqtgraph"]

# --- System monitoring ---
monitoring = ["psutil"]

# --- Existing optional groups ---
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
spiking = ["snnTorch>=0.8"]
llm = ["openai>=1.0"]

# --- Full install ---
full = [
    "bioplausible[vision,lm,rl,lightning,analysis,ml,plot,deploy,export,p2p,ui,monitoring,knowledgebase,graphs,spiking,llm]",
]

[project.urls]
homepage = "https://github.com/bioplausible/bioplausible"
repository = "https://github.com/bioplausible/bioplausible"
documentation = "https://bioplausible.readthedocs.io"

[project.scripts]
eqprop-verify = "bioplausible.cli:main"
biopl-hpo = "bioplausible.cli.hpo:main"
biopl-run = "bioplausible.experiment.cli:main"
eqprop-p2p-worker = "bioplausible.p2p.p2p_worker:main"
biopl-scientist = "bioplausible.execution.cli:main_scientist"
biopl-report = "bioplausible.experiment.cli:main_report"
biopl-registry-audit = "bioplausible.core.audit:main"
biopl-repro-check = "bioplausible.cli.repro:main"
biopl-parity = "bioplausible.cli.parity:main"
biopl-frontier = "bioplausible.cli.frontier:main"
biopl-failure-manifesto = "bioplausible.analysis.failure_manifesto:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (e.g. MNIST full epoch)",
    "gpu: runs on CUDA device; skipped when GPU unavailable",
    "gpu_only: requires CUDA; skipped on CPU-only machines",
    "benchmark: performance/parity benchmark producing JSONL",
    "flaky: quarantined non-deterministic test (Sprint 5.6)",
    "llm: requires a real LLM provider; skipped in CI",
]
addopts = "--cov=bioplausible --cov-report=term-missing --cov-fail-under=85 -p no:warnings"

[tool.coverage.run]
source = ["bioplausible"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = ["E501", "lowercase-imported-as-non-lowercase", "non-augmented-assignment"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "too-many-arguments", "too-many-statements", "PLR2004", "RUF069"]
"bioplausible/experiment/**/*.py" = ["raise-vanilla-args"]
"tests/**/conftest.py" = ["too-many-arguments", "too-many-statements"]
"examples/legacy/**/*.py" = ["assert", "too-many-arguments", "too-many-statements"]
"examples/**/*.py" = ["assert", "too-many-arguments", "too-many-statements"]
"scripts/legacy/**/*.py" = ["assert", "too-many-arguments", "too-many-statements"]
"scripts/**/*.py" = ["assert", "too-many-arguments", "too-many-statements"]
"docs/**/*.py" = ["assert", "too-many-arguments", "too-many-statements"]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.pyright]
# Relaxed from `strict = true` to a per-rule config: noisy inference-by-flow
# rules (reportUnknown*, reportMissingType*, reportMissingParameterType)
# are downgraded to warnings to reduce churn on a fast-moving research
# codebase.  Hard correctness rules (reportMissingImports,
# reportMissingModuleSource, reportInvalidTypeForm, reportInvalidTypeVarUse)
# stay as errors.
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportInvalidTypeForm = "error"
reportInvalidTypeVarUse = "error"
reportUnnecessaryCast = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportPrivateImportUsage = "warning"
reportDeprecated = "warning"
reportConstantRedefinition = "warning"
reportInconsistentConstructor = "warning"
reportInconsistentOverload = "warning"
reportInvalidStubStatement = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportWildcardImportFromLibrary = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUnusedCoroutine = "warning"
reportUnusedImport = "warning"
reportUnusedExcept = "warning"
reportUnusedExpression = "warning"
pythonVersion = "3.14"
targetVersion = "3.14"

[tool.hypothesis]
# Property-based testing configuration
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
