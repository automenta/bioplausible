# Parity demo — scaled-down end-to-end proof of the experiment layer.
# Small tasks/grid/seeds so the full pipeline runs unattended in minutes.
# The parity/tier evidence gates (seeds>=10, matched_by, dual energy) are
# exercised by `validate` only in examples/parity_cifar10_mlp.yaml; this demo
# keeps seeds small to stay fast while proving validate/plan/run/report.
meta: {name: parity_demo, created: '2026-08-05'}

compute:
  device: cpu
  num_workers: 0
  track: {flops: true, memory: true, energy: false}

arms:
  mlp:
    max_params: 50_000
    models: [backprop_mlp, eqprop_mlp, deep_hebbian]

stages:
  - name: smoke
    task: xor
    epochs: 2
    seeds: 2
    configs: {hidden_dim: [16, 32], num_layers: [2]}
    pass_rule: {min_seed_ok: 2, rules: [{metric: acc, op: '>=', value: 0.45}]}
  - name: shallow
    task: circles
    epochs: 2
    seeds: 2
    configs: {hidden_dim: [32]}
    pass_rule: {min_seed_ok: 2, rules: []}

reproducibility: {seed: 7, capture_env: false}
