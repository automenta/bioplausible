meta: {name: smoke_campaign, created: '2026-08-05'}
compute: {device: cpu, num_workers: 0}
arms:
  mlp: {max_params: 100000, models: [backprop_mlp]}
stages:
  - name: smoke
    task: xor
    epochs: 1
    seeds: 1
    configs: {hidden_dim: [16], num_layers: [2]}
    pass_rule: {min_seed_ok: 1, rules: [{metric: acc, op: '>=', value: 0.5}]}
reproducibility: {seed: 7, capture_env: false}
