# Parity campaign: bio-plausible MLPs vs backprop on digits — thorough variant.
# Same evidence contract as parity_digits.yaml but a richer parity schedule
# (15 epochs over 3 hidden sizes, 10 seeds) so the report's parity table and
# Pareto frontier are built on near-converged, multi-config results while still
# completing well within a half-hour on GPU.
meta: {name: parity_digits_thorough, created: '2026-08-06'}

compute:
  device: auto
  num_workers: 0
  track: {flops: true, memory: true, energy: false}

arms:
  mlp:
    max_params: 210_000
    models: [backprop_mlp, eqprop_mlp, neural_cube, deep_hebbian,
             three_factor_hebbian, standard_fa, diff_target_prop,
             pepita, forward_forward]

stages:
  - name: smoke
    task: xor
    epochs: 15
    seeds: 1
    configs: {hidden_dim: [16, 32], num_layers: [2]}
    pass_rule: {min_seed_ok: 1, rules: [{metric: acc, op: '>=', value: 0.60}]}
  - name: parity
    task: digits
    epochs: 15
    seeds: 10
    configs: {hidden_dim: [64, 128, 256], num_layers: [2]}
    baseline: backprop_mlp
    matched_by:
      equal_budget: max_params
      reported: [wall_time_s, forward_flops, backward_flops]
    energy: [gpu_tdp_x_util, op_count]
    pass_rule: {min_seed_ok: 10, rules: []}

reproducibility: {seed: 42, capture_env: true}
