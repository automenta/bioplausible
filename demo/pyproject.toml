[project]
name = "bioplausible-demo"
version = "0.1.0"
description = "Interactive NiceGUI demo for Bioplausible — bio-plausible learning framework."
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.12.0,<4.0",
    "plotly>=5.20,<6.0",
    "torch",
    "numpy",
    "pydantic>=2.0",
    "pyyaml",
    "optuna>=4.9.0",
    "tabulate>=0.9",
    "datasets>=5.0.1",
    "bioplausible[full]",
    "ipywidgets>=8.1.8",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
bioplausible = { path = "../", editable = true }
