repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
      - id: pytest-fast
        name: pytest (property tests)
        entry: uv run pytest tests/property/ -q
        language: system
        pass_filenames: false
        always_run: true