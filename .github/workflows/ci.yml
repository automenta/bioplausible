name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Check Formatting (Ruff)
        run: uv run ruff format --check .
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Type Check (Pyright)
        run: uv run pyright .
      - name: Property Tests (Fast CI Gate)
        run: uv run pytest tests/property/ -q
      - name: Demo Gate (demonstration suite + figure lock)
        run: uv run pytest tests/integration/ -k "demo or gallery_lock" -q
      - name: Drift Locks (README snippets, root exports)
        run: |
          uv run pytest tests/unit/core/test_readme_snippet_lock.py \
            tests/unit/core/test_root_exports.py -q
      - name: Preset Validation (from-config)
        run: |
          uv run python -c "
          import sys
          from omegaconf import OmegaConf
          from computronium.cli.commands.train import _build_system_from_flat_config

          for preset in [
              'configs/presets/backprop_mnist.yaml',
              'configs/presets/eqprop_mnist.yaml',
              'configs/presets/fa_mnist.yaml',
              'configs/presets/ff_mnist.yaml',
              'configs/presets/pepita_mnist.yaml',
              'configs/presets/tp_mnist.yaml',
              'configs/presets/pc_mnist.yaml',
              'configs/presets/hebbian_mnist.yaml',
              'configs/presets/snn_mnist.yaml',
              'configs/presets/tile_mnist.yaml',
              'configs/presets/routing_mnist.yaml',
              'configs/presets/fast_weight_mnist.yaml',
              'configs/presets/eqprop_routing_mnist.yaml',
              'configs/presets/eqprop_fast_weight_mnist.yaml',
              'configs/presets/memristive_mnist.yaml',
          ]:
              print(f'Validating {preset}...', end=' ')
              sys.stdout.flush()
              try:
                  cfg = OmegaConf.load(preset)
                  config = OmegaConf.to_container(cfg, resolve=True)
                  _build_system_from_flat_config(
                      config.get('substrate', {}),
                      config.get('geometry', {}),
                      config.get('dynamics', {}),
                      config.get('plasticity', {}),
                      config.get('credit', {}),
                      config.get('update', {}),
                  )
                  print('OK')
              except Exception as e:
                  print(f'FAILED: {e}')
                  sys.exit(1)
          print('All presets validated successfully!')
          "
      - name: Registry Audit (metadata completeness)
        run: uv run comp audit --metadata
      - name: Reproducibility Check
        # native_tile_ep excluded: pre-existing failure (TODO10.md Register C)
        run: uv run comp repro --device cpu --models native_backprop_mlp,native_eqprop_mlp,native_fa_mlp,native_pepita_mlp,native_tile_fa,native_tile_hebbian,native_tile_tp
      - name: Dependency Scan (pip-audit)
        run: uv run pip-audit

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rocq
        run: |
          sudo apt-get update && sudo apt-get install -y rocq
      - name: Verify Rocq Installation
        run: rocq --version
      - name: Compile Rocq Formalization
        run: |
          cd rocq
          rocq compile -I /usr/lib/ocaml/coq/user-contrib/Stdlib/Reals -I /usr/lib/ocaml/coq/theories ComputroniumFormal.v

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install build tools
        run: uv sync --only-dev
      - name: Build Package
        run: uv run python -m build
      - name: Verify Artifacts
        run: ls -l dist/