name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Check Formatting (Ruff)
        run: uv run ruff format --check .
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Type Check (Pyright)
        run: uv run pyright .
      - name: Property Tests (Fast CI Gate)
        run: uv run pytest tests/property/ -q
      - name: Registry Audit (metadata completeness)
        run: uv run biopl-registry-audit --metadata
      - name: Reproducibility Check
        run: uv run biopl-repro-check --device cpu
      - name: Dependency Scan (pip-audit)
        run: uv run pip-audit

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install build tools
        run: uv sync --only-dev
      - name: Build Package
        run: uv run python -m build
      - name: Verify Artifacts
        run: ls -l dist/