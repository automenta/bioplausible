# Routing MLP on MNIST - 6-D coordinate with RoutingPlasticity
substrate:
  type: digital
  precision: float32
  noise_level: 0.0
  weight_bounds: null
  sparsity: 0.0
  device: auto

geometry:
  type: feedforward
  input_dim: 784
  output_dim: 10
  hidden_dims: [256, 256]
  num_layers: 3
  topology_type: feedforward
  connectivity: null
  recurrent_weight: null
  init_scale: 0.1

dynamics:
  type: instantaneous

plasticity:
  type: routing
  gate_dim: 64
  temperature: 1.0
  decay: 0.99
  learning_rate: 0.01

credit:
  type: backprop

update:
  type: euclidean
  step_size: 0.001
  momentum: 0.9
  ortho_steps: 5
  spectral_norm: 1.0
  fisher_damping: 1e-3
  ewc_lambda: 1000.0

training:
  max_epochs: 10
  batch_size: 64
  val_batch_size: 64
  lr: 0.001
  device: auto
  grad_clip: 1.0
  track_energy: true
  track_flops: true
  track_memory: true
  log_every_n_steps: 100

seed: 42
deterministic: false